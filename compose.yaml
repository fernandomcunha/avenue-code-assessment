services:
  web:
    image: ruby:4.0.9
    working_dir: /rails
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      BINDING: 0.0.0.0
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
      (bundle check || bundle install) &&
      bin/rails server -b 0.0.0.0"

volumes:
  bundle_cache:
